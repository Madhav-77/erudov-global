<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- title and meta description are injected per-route by react-helmet-async -->

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.erudov.com/" />
    <meta property="og:title" content="Erudov Global — Study Abroad with Confidence" />
    <meta property="og:description" content="Expert guidance for Indian students applying to international universities across 11 destinations — admissions, visa, scholarships and more." />
    <meta property="og:image" content="https://www.erudov.com/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Erudov Global" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / WhatsApp -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Erudov Global — Study Abroad with Confidence" />
    <meta name="twitter:description" content="Expert guidance for Indian students applying to international universities across 11 destinations — admissions, visa, scholarships and more." />
    <meta name="twitter:image" content="https://www.erudov.com/assets/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.erudov.com/" />

    <!-- Font -->
    <link rel="preload" as="font" type="font/ttf" crossorigin href="/assets/OpenSans.ttf" />
    <style>
      @font-face {
        font-family: 'Open Sans';
        src: url('/assets/OpenSans.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
